[project]
name = "oc-projet-9"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JPoitreau", email = "113617948+JPoitreau@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "faiss-cpu>=1.15.0",
    "fastapi>=0.141.1",
    "jupyter>=1.1.1",
    "langchain>=1.3.16",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.6.0",
    "langchain-text-splitters>=1.1.2",
    "openai>=2.45,<3.3.1",
    "pandas>=3.0.5",
    "datasets>=3.0.0",
    "ragas>=0.4.3",
    "ruff>=0.16.4",
    "sentence-transformers>=6.0.0",
    "streamlit>=1.62.0",
    "typing>=3.10.0.0",
    "uv>=0.12.5",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.28.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: tests de performance légers (optionnel)",
]

[project.scripts]
oc-projet-9 = "oc_projet_9:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
